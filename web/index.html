<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>区域器械消毒追溯系统</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div id="login-view" class="login-wrap hidden">
    <div class="login-card">
      <div class="login-logo">✚</div>
      <h1>区域消毒供应中心</h1>
      <p class="login-sub">可复用器械消毒全程追溯系统</p>
      <form id="login-form">
        <label>账号<input name="username" autocomplete="username" placeholder="op / rev / sup / kp" required></label>
        <label>密码<input name="password" type="password" autocomplete="current-password" placeholder="123456" required></label>
        <button class="btn btn-primary btn-block" type="submit">登 录</button>
      </form>
      <div class="login-hint">
        <b>演示账号（密码均为 123456）</b>
        <span>王丽(操作员 op) · 陈强(审核人 rev) · 李督导(感控督导员 sup)</span>
        <span>康平(kp) · 和美(hm) · 健齿(jc) 诊所端</span>
      </div>
    </div>
  </div>

  <div id="app-view" class="hidden">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-icon">✚</span>
        <div><div class="brand-title">消毒追溯</div><div class="brand-sub">CSSD Trace</div></div>
      </div>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <div id="user-box"></div>
        <button class="btn btn-ghost btn-sm" id="logout-btn">退出登录</button>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div id="page-title">工作台</div>
        <div class="topbar-right">
          <span id="alarm-badge" class="alarm-badge hidden"></span>
          <button class="btn btn-ghost btn-sm" id="notify-btn">通知 <span id="notify-count" class="badge hidden">0</span></button>
        </div>
      </header>
      <section id="content" class="content"></section>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/pages/dashboard.js"></script>
  <script src="/js/pages/recovery.js"></script>
  <script src="/js/pages/wash.js"></script>
  <script src="/js/pages/package.js"></script>
  <script src="/js/pages/sterile.js"></script>
  <script src="/js/pages/distribution.js"></script>
  <script src="/js/pages/clinic.js"></script>
  <script src="/js/pages/quality.js"></script>
  <script src="/js/pages/trace.js"></script>
  <script src="/js/pages/report.js"></script>
  <script src="/js/pages/audit.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
